<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-label="API surface and artifacts">
      
    <defs>
      <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#0f172a"/>
        <stop offset="52%" stop-color="#1e3a8a"/>
        <stop offset="100%" stop-color="#0f766e"/>
      </linearGradient>
      <linearGradient id="panelGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
        <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.98"/>
      </linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity="0.18"/>
      </filter>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#2563eb" />
      </marker>
      <marker id="arrowDark" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#334155" />
      </marker>
    </defs>
    
      <rect width="1400" height="560" fill="#f8fafc"/>
      <text x="70" y="70" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="36" font-weight="900" fill="#0f172a">API and artifact surface</text>
      <text x="72" y="102" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#64748b">The project is framed as a small service, not just a notebook experiment.</text>
      <rect x="80" y="150" width="360" height="300" rx="24" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
      <text x="112" y="195" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="23" font-weight="900" fill="#0f172a">Reviewer request</text>
      <text x="112" y="238" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="800" fill="#2563eb">POST /v1/predictions</text>
      <text x="112" y="272" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="800" fill="#2563eb">POST /v1/batch-predictions</text>
      <text x="112" y="306" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="800" fill="#2563eb">GET /v1/models/latest/metrics</text>
      <text x="112" y="340" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="800" fill="#2563eb">GET /v1/monitoring/latest/drift</text>
      <path d="M462,300 C510,300 530,300 585,300" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
      <rect x="600" y="150" width="360" height="300" rx="24" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
      <text x="632" y="195" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="23" font-weight="900" fill="#0f172a">Pipeline execution</text>
      <text x="632" y="238" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#475569">validate CSV contract</text>
      <text x="632" y="272" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#475569">merge company-quarter panel</text>
      <text x="632" y="306" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#475569">train/score baselines</text>
      <text x="632" y="340" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#475569">build explanations + monitors</text>
      <path d="M982,300 C1030,300 1050,300 1105,300" stroke="#2563eb" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
      <rect x="1120" y="150" width="300" height="300" rx="24" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
      <text x="1152" y="195" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="23" font-weight="900" fill="#0f172a">Returned artifacts</text>
      <text x="1152" y="238" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#475569">decision packet JSON</text>
      <text x="1152" y="272" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#475569">static dashboard HTML</text>
      <text x="1152" y="306" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#475569">markdown risk report</text>
      <text x="1152" y="340" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#475569">LLM prompt packet</text>
      <text x="1152" y="374" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#475569">quality / drift report</text>
    </svg>
