<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Reviewer map</title>
  <desc id="desc">What reviewers can inspect in five minutes: README, API, tests, dashboard, and artifacts.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420"><stop stop-color="#FEFEFF"/><stop offset="1" stop-color="#F0F9FF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.14"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#2563EB"/></marker>
  </defs>
  <rect width="1280" height="420" rx="30" fill="url(#bg)"/>
  <text x="64" y="70" fill="#0F172A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="850">5-minute reviewer map</text>
  <text x="64" y="102" fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">A hiring manager can inspect the project without reading every source file.</text>
  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(64 158)"><rect width="190" height="130" rx="20" fill="#FFFFFF" stroke="#DBEAFE"/><text x="26" y="44" fill="#1D4ED8" font-size="18" font-weight="850">README</text><text x="26" y="74" fill="#64748B" font-size="14">problem framing</text><text x="26" y="97" fill="#64748B" font-size="14">visual architecture</text></g>
    <g transform="translate(306 158)"><rect width="190" height="130" rx="20" fill="#FFFFFF" stroke="#DBEAFE"/><text x="26" y="44" fill="#0F766E" font-size="18" font-weight="850">Run demo</text><text x="26" y="74" fill="#64748B" font-size="14">one command</text><text x="26" y="97" fill="#64748B" font-size="14">generates artifacts</text></g>
    <g transform="translate(548 158)"><rect width="190" height="130" rx="20" fill="#FFFFFF" stroke="#DBEAFE"/><text x="26" y="44" fill="#7C3AED" font-size="18" font-weight="850">API docs</text><text x="26" y="74" fill="#64748B" font-size="14">FastAPI schema</text><text x="26" y="97" fill="#64748B" font-size="14">single + batch</text></g>
    <g transform="translate(790 158)"><rect width="190" height="130" rx="20" fill="#FFFFFF" stroke="#DBEAFE"/><text x="26" y="44" fill="#BE123C" font-size="18" font-weight="850">Tests</text><text x="26" y="74" fill="#64748B" font-size="14">contract checks</text><text x="26" y="97" fill="#64748B" font-size="14">pipeline smoke</text></g>
    <g transform="translate(1032 158)"><rect width="190" height="130" rx="20" fill="#FFFFFF" stroke="#DBEAFE"/><text x="26" y="44" fill="#B45309" font-size="18" font-weight="850">Dashboard</text><text x="26" y="74" fill="#64748B" font-size="14">HTML snapshot</text><text x="26" y="97" fill="#64748B" font-size="14">decision packet</text></g>
  </g>
  <g stroke="#2563EB" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" opacity="0.9">
    <path d="M256 223H303"/><path d="M498 223H545"/><path d="M740 223H787"/><path d="M982 223H1029"/>
  </g>
  <text x="64" y="354" fill="#334155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Resume line:</text>
  <text x="164" y="354" fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Built a service-shaped financial ML portfolio project with validation, API, monitoring, and reviewer-ready artifacts.</text>
</svg>
