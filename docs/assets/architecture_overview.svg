      <text x="1185" y="310" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#166534">✓ API + Docker + CI</text>
      <text x="1185" y="346" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#166534">✓ dashboard artifact</text>
      <line x1="1185" y1="378" x2="1385" y2="378" stroke="#e2e8f0"/>
