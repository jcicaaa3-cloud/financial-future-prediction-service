      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#2563eb" />
      </marker>
      <marker id="arrowDark" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#334155" />
      </marker>
    </defs>
    
      <rect width="1480" height="720" fill="#f8fafc"/>
      <text x="70" y="60" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="36" font-weight="900" fill="#0f172a">System architecture</text>
      <text x="72" y="90" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#64748b">From company-quarter CSVs to validated API responses and portfolio artifacts</text>
      
          <rect x="90" y="100" width="1020" height="72" rx="18" fill="#e0f2fe" stroke="#cbd5e1"/>
