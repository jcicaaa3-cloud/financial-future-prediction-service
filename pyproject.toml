[project]
name = "quarterly-financial-risk-scoring-service"
version = "0.5.0"
description = "Portfolio-grade FastAPI quarterly financial risk scoring service."
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "app", "tests"]

[tool.ruff.lint]
select = ["F"]
ignore = []
