<svg width="1280" height="620" viewBox="0 0 1280 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">System architecture diagram</title>
  <desc id="desc">Architecture showing data ingestion, feature engineering, model training, service API, artifact store, monitoring, and reviewer dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="620"><stop stop-color="#0B1220"/><stop offset="1" stop-color="#10233F"/></linearGradient>
    <linearGradient id="stroke" x1="100" y1="80" x2="1180" y2="540"><stop stop-color="#5EEAD4"/><stop offset="0.52" stop-color="#60A5FA"/><stop offset="1" stop-color="#C084FC"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity="0.35"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2 2L10 6L2 10Z" fill="#93C5FD"/></marker>
  </defs>
  <rect width="1280" height="620" rx="30" fill="url(#bg)"/>
  <text x="68" y="70" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="850">System design, not just model code</text>
  <text x="68" y="104" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">The project is shaped like a deployable ML service: contracts, orchestration, APIs, artifacts, and monitoring are separate concerns.</text>

  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(76 156)">
      <rect width="220" height="160" rx="22" fill="#111827" stroke="#334155"/>
      <text x="24" y="38" fill="#5EEAD4" font-size="18" font-weight="800">Input layer</text>
      <text x="24" y="72" fill="#E2E8F0" font-size="16" font-weight="700">CSV contract</text>
      <text x="24" y="99" fill="#94A3B8" font-size="14">financials · market</text>
      <text x="24" y="122" fill="#94A3B8" font-size="14">macro · disclosure</text>
    </g>
    <g transform="translate(360 104)">
      <rect width="250" height="184" rx="22" fill="#111827" stroke="#334155"/>
      <text x="24" y="38" fill="#93C5FD" font-size="18" font-weight="800">ML pipeline</text>
      <text x="24" y="72" fill="#E2E8F0" font-size="16" font-weight="700">schema → features</text>
      <text x="24" y="99" fill="#94A3B8" font-size="14">leakage guard</text>
      <text x="24" y="122" fill="#94A3B8" font-size="14">chronological split</text>
      <text x="24" y="145" fill="#94A3B8" font-size="14">baseline leaderboard</text>
    </g>
    <g transform="translate(690 104)">
      <rect width="250" height="184" rx="22" fill="#111827" stroke="#334155"/>
      <text x="24" y="38" fill="#C4B5FD" font-size="18" font-weight="800">Service layer</text>
      <text x="24" y="72" fill="#E2E8F0" font-size="16" font-weight="700">FastAPI</text>
      <text x="24" y="99" fill="#94A3B8" font-size="14">single prediction</text>
      <text x="24" y="122" fill="#94A3B8" font-size="14">batch prediction</text>
      <text x="24" y="145" fill="#94A3B8" font-size="14">model metrics endpoints</text>
    </g>
    <g transform="translate(1012 156)">
      <rect width="220" height="160" rx="22" fill="#111827" stroke="#334155"/>
      <text x="24" y="38" fill="#F9A8D4" font-size="18" font-weight="800">Review layer</text>
      <text x="24" y="72" fill="#E2E8F0" font-size="16" font-weight="700">Artifacts</text>
      <text x="24" y="99" fill="#94A3B8" font-size="14">dashboard · report</text>
      <text x="24" y="122" fill="#94A3B8" font-size="14">decision packet · LLM prompt</text>
    </g>
    <g transform="translate(222 400)">
      <rect width="250" height="118" rx="22" fill="#0F172A" stroke="#334155"/>
      <text x="24" y="38" fill="#FDE68A" font-size="18" font-weight="800">Monitoring</text>
      <text x="24" y="72" fill="#CBD5E1" font-size="14">data quality + drift smoke report</text>
    </g>
    <g transform="translate(540 400)">
      <rect width="250" height="118" rx="22" fill="#0F172A" stroke="#334155"/>
      <text x="24" y="38" fill="#86EFAC" font-size="18" font-weight="800">Governance</text>
      <text x="24" y="72" fill="#CBD5E1" font-size="14">model card + disclaimers + audit trail</text>
    </g>
    <g transform="translate(858 400)">
      <rect width="250" height="118" rx="22" fill="#0F172A" stroke="#334155"/>
      <text x="24" y="38" fill="#67E8F9" font-size="18" font-weight="800">Deployment shell</text>
      <text x="24" y="72" fill="#CBD5E1" font-size="14">Docker + CI + pytest contract checks</text>
    </g>
  </g>

  <g stroke="#93C5FD" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" opacity="0.95">
    <path d="M296 236H356"/>
    <path d="M610 196H686"/>
    <path d="M940 236H1008"/>
    <path d="M501 288C480 340 432 370 380 398"/>
    <path d="M790 288C777 340 722 370 690 398"/>
    <path d="M838 288C895 336 956 360 982 398"/>
  </g>
  <rect x="66" y="560" width="1148" height="1" fill="url(#stroke)" opacity="0.7"/>
  <text x="68" y="588" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Portfolio narrative: financial ML is evaluated as a product surface, not as an isolated notebook metric.</text>
</svg>
