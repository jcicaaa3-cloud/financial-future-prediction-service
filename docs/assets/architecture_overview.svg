          <text x="160" y="247" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="550" fill="#475569">schema validation · missingness · quarter coverage · sample gates</text>
