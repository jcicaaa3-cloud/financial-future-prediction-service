          <text x="160" y="523" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="550" fill="#475569">FastAPI single prediction · batch scoring · model metrics endpoints</text>
        <path d="M600,548 L600,552" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrowDark)"/>
