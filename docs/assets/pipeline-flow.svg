<svg width="1280" height="520" viewBox="0 0 1280 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">End-to-end risk scoring pipeline</title>
  <desc id="desc">CSV inputs flow through schema validation, feature engineering, time-aware model training, FastAPI service, monitoring, and reviewer dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="520"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#E0F2FE"/></linearGradient>
    <linearGradient id="line" x1="60" y1="270" x2="1220" y2="270"><stop stop-color="#14B8A6"/><stop offset="0.5" stop-color="#3B82F6"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.16"/></filter>
    <filter id="arrowGlow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#2563EB" flood-opacity="0.8"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2 2L10 6L2 10Z" fill="#2563EB"/></marker>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M2 2L10 6L2 10Z" fill="#8B5CF6"/></marker>
  </defs>
  <rect width="1280" height="520" rx="30" fill="url(#bg)"/>
  <text x="64" y="70" fill="#0F172A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="850">Reviewer-visible pipeline</text>
  <text x="64" y="103" fill="#475569" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">The README shows that this is not a notebook demo: it has a data contract, service boundary, validation discipline, monitoring, and artifacts.</text>

  <path d="M104 286 C226 194, 290 360, 404 268 S596 244, 686 286 S828 366, 938 268 S1060 214, 1162 286" stroke="url(#line)" stroke-width="8" stroke-linecap="round" opacity="0.35"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#cardShadow)">
    <g transform="translate(54 150)">
      <rect width="166" height="160" rx="20" fill="#FFFFFF" stroke="#BAE6FD"/>
      <circle cx="38" cy="38" r="21" fill="#CCFBF1"/><text x="38" y="46" fill="#0F766E" text-anchor="middle" font-size="22" font-weight="900">1</text>
      <text x="28" y="82" fill="#0F172A" font-size="19" font-weight="800">Data contract</text>
      <text x="28" y="111" fill="#64748B" font-size="14">5 CSV inputs</text>
      <text x="28" y="134" fill="#64748B" font-size="14">schema checks</text>
    </g>
    <g transform="translate(254 210)">
      <rect width="166" height="160" rx="20" fill="#FFFFFF" stroke="#BAE6FD"/>
      <circle cx="38" cy="38" r="21" fill="#DBEAFE"/><text x="38" y="46" fill="#1D4ED8" text-anchor="middle" font-size="22" font-weight="900">2</text>
      <text x="28" y="82" fill="#0F172A" font-size="19" font-weight="800">Features</text>
      <text x="28" y="111" fill="#64748B" font-size="14">ratios · rolling</text>
      <text x="28" y="134" fill="#64748B" font-size="14">available-at-time</text>
    </g>
    <g transform="translate(454 150)">
      <rect width="166" height="160" rx="20" fill="#FFFFFF" stroke="#BAE6FD"/>
      <circle cx="38" cy="38" r="21" fill="#EDE9FE"/><text x="38" y="46" fill="#7C3AED" text-anchor="middle" font-size="22" font-weight="900">3</text>
      <text x="28" y="82" fill="#0F172A" font-size="19" font-weight="800">Validation</text>
      <text x="28" y="111" fill="#64748B" font-size="14">chronological</text>
      <text x="28" y="134" fill="#64748B" font-size="14">walk-forward</text>
    </g>
    <g transform="translate(654 210)">
      <rect width="166" height="160" rx="20" fill="#FFFFFF" stroke="#BAE6FD"/>
      <circle cx="38" cy="38" r="21" fill="#FCE7F3"/><text x="38" y="46" fill="#BE185D" text-anchor="middle" font-size="22" font-weight="900">4</text>
      <text x="28" y="82" fill="#0F172A" font-size="19" font-weight="800">FastAPI</text>
      <text x="28" y="111" fill="#64748B" font-size="14">single + batch</text>
      <text x="28" y="134" fill="#64748B" font-size="14">decision packet</text>
    </g>
    <g transform="translate(854 150)">
      <rect width="166" height="160" rx="20" fill="#FFFFFF" stroke="#BAE6FD"/>
      <circle cx="38" cy="38" r="21" fill="#FEF3C7"/><text x="38" y="46" fill="#B45309" text-anchor="middle" font-size="22" font-weight="900">5</text>
      <text x="28" y="82" fill="#0F172A" font-size="19" font-weight="800">Monitoring</text>
      <text x="28" y="111" fill="#64748B" font-size="14">data quality</text>
      <text x="28" y="134" fill="#64748B" font-size="14">drift smoke</text>
    </g>
    <g transform="translate(1054 210)">
      <rect width="166" height="160" rx="20" fill="#FFFFFF" stroke="#BAE6FD"/>
      <circle cx="38" cy="38" r="21" fill="#DCFCE7"/><text x="38" y="46" fill="#15803D" text-anchor="middle" font-size="22" font-weight="900">6</text>
      <text x="28" y="82" fill="#0F172A" font-size="19" font-weight="800">Dashboard</text>
      <text x="28" y="111" fill="#64748B" font-size="14">HTML snapshot</text>
      <text x="28" y="134" fill="#64748B" font-size="14">reviewer ready</text>
    </g>
  </g>

  <g stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#arrowGlow)">
    <path d="M218 236 C238 214, 244 214, 257 230" stroke="#2563EB" marker-end="url(#arrow)"/>
    <path d="M420 284 C436 306, 442 306, 457 286" stroke="#2563EB" marker-end="url(#arrow)"/>
    <path d="M620 236 C638 214, 644 214, 657 230" stroke="#2563EB" marker-end="url(#arrow)"/>
    <path d="M820 284 C836 306, 842 306, 857 286" stroke="#8B5CF6" marker-end="url(#arrow2)"/>
    <path d="M1020 236 C1038 214, 1044 214, 1057 230" stroke="#8B5CF6" marker-end="url(#arrow2)"/>
  </g>

  <text x="64" y="450" fill="#334155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="650">Portfolio signal:</text>
  <text x="202" y="450" fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Every stage leaves a reviewable artifact, so the project can be evaluated without running hidden notebooks.</text>
</svg>
