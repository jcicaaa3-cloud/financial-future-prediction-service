      <text x="82" y="126" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#64748b">A hiring manager can understand the project without reading every source file.</text>
      
          <circle cx="150" cy="180" r="54" fill="#1d4ed8"/>
