<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Quarterly Financial Risk Scoring Service</title>
  <desc id="desc">Portfolio-grade ML backend with data contract, leakage-aware features, FastAPI, monitoring, and dashboard.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="0.45" stop-color="#0B1B33"/>
      <stop offset="1" stop-color="#142B4D"/>
    </linearGradient>
    <linearGradient id="accent" x1="240" y1="120" x2="1110" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/>
      <stop offset="0.55" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.36 0 0 0 0 0.9 0 0 0 0 0.85 0 0 0 0.55 0" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="420" rx="34" fill="url(#bg)"/>
  <circle cx="1080" cy="-40" r="270" fill="#2563EB" opacity="0.20"/>
  <circle cx="80" cy="390" r="240" fill="#14B8A6" opacity="0.16"/>
  <path d="M40 352C173 258 291 303 407 224C517 149 653 109 789 151C922 192 1007 303 1241 208" stroke="url(#accent)" stroke-width="3" opacity="0.35"/>

  <g filter="url(#shadow)">
    <rect x="56" y="54" width="1168" height="312" rx="28" fill="#0B1220" opacity="0.72" stroke="#243B5A"/>
  </g>

  <text x="88" y="124" fill="#7DD3FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="2.8">PORTFOLIO-GRADE ML BACKEND</text>
  <text x="88" y="177" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="48" font-weight="800">Quarterly Financial Risk</text>
  <text x="88" y="232" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="48" font-weight="800">Scoring Service</text>
  <text x="90" y="274" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21">Leakage-aware feature pipeline · chronological validation · FastAPI inference · monitoring artifacts · portfolio dashboard</text>

  <g transform="translate(88 304)">
    <rect width="130" height="38" rx="19" fill="#0F766E" opacity="0.95"/><text x="65" y="25" fill="white" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">FastAPI</text>
    <rect x="146" width="158" height="38" rx="19" fill="#1D4ED8" opacity="0.95"/><text x="225" y="25" fill="white" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">Walk-forward eval</text>
    <rect x="320" width="134" height="38" rx="19" fill="#7C3AED" opacity="0.95"/><text x="387" y="25" fill="white" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">Monitoring</text>
    <rect x="470" width="146" height="38" rx="19" fill="#BE123C" opacity="0.95"/><text x="543" y="25" fill="white" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">Not investment advice</text>
  </g>

  <g transform="translate(790 88)" filter="url(#shadow)">
    <rect width="368" height="224" rx="24" fill="#111827" stroke="#334155"/>
    <text x="28" y="44" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800">Service output</text>
    <g transform="translate(28 70)">
      <rect width="310" height="34" rx="12" fill="#13243B"/><text x="18" y="23" fill="#93C5FD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700">decision_packet.json</text>
      <rect y="45" width="256" height="12" rx="6" fill="#14B8A6" opacity="0.90"/>
      <rect y="69" width="295" height="12" rx="6" fill="#60A5FA" opacity="0.88"/>
      <rect y="93" width="228" height="12" rx="6" fill="#A78BFA" opacity="0.88"/>
      <rect y="132" width="126" height="34" rx="12" fill="#0F766E"/><text x="63" y="22" fill="white" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">low risk</text>
      <path d="M148 149H216" stroke="#5EEAD4" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
      <path d="M216 149L202 138M216 149L202 160" stroke="#5EEAD4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
      <rect x="230" y="132" width="80" height="34" rx="12" fill="#1D4ED8"/><text x="270" y="22" fill="white" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">API</text>
    </g>
  </g>
</svg>
