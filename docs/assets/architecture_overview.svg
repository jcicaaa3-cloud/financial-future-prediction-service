          <text x="160" y="155" text-anchor="start" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="550" fill="#475569">company_master · financial_statement · market · macro · disclosures</text>
        <path d="M600,180 L600,184" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrowDark)"/>
